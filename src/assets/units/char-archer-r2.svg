<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Archer, Rank 2 / Tier 2 "Medieval Classic" — right-facing archer, recurve longbow, studded leather reinforcement over tunic -->

  <ellipse cx="100" cy="188" rx="40" ry="7" fill="#000000" opacity="0.25"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) leg -->
      <path d="M91,112 L87,156 Q86,167 93,169 L103,169 Q105,165 101,159 L100,112 Z" fill="#413d48"/>
      <ellipse cx="95" cy="173" rx="10" ry="6" fill="#232733"/>

      <!-- front (leading) leg -->
      <path d="M113,112 L128,150 Q131,163 122,168 L108,168 Q105,163 110,155 L111,112 Z" fill="#706c78"/>
      <ellipse cx="119" cy="172" rx="11" ry="7" fill="#232733"/>
      <ellipse cx="118" cy="138" rx="8" ry="5" fill="#dcd8e2" opacity="0.45"/>
    </g>

    <!-- quiver on the back, a few arrows visible, brass band added -->
    <g transform="rotate(-13 73 74)">
      <rect x="65" y="50" width="15" height="47" rx="7" fill="#5c4a3a"/>
      <rect x="65" y="50" width="6" height="47" rx="3" fill="#46362a"/>
      <rect x="64" y="66" width="17" height="4" fill="#b8925a"/>
    </g>
    <line x1="65" y1="53" x2="58" y2="29" stroke="#dcd8e2" stroke-width="3" stroke-linecap="round"/>
    <line x1="71" y1="50" x2="68" y2="24" stroke="#dcd8e2" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="52" x2="79" y2="27" stroke="#dcd8e2" stroke-width="3" stroke-linecap="round"/>
    <polygon points="58,29 53,23 61,25" fill="#706c78"/>
    <polygon points="68,24 63,18 72,20" fill="#706c78"/>
    <polygon points="79,27 75,20 84,23" fill="#706c78"/>

    <!-- faction sash: sole army-accent element (diagonal chest strap), unchanged position/shape -->
    <polygon id="army-accent" fill="#4da3ff" points="90,57 100,57 122,105 112,110"/>

    <!-- torso: tunic, tier-2 palette -->
    <rect x="82" y="58" width="44" height="52" rx="14" fill="#706c78"/>
    <rect x="84" y="60" width="40" height="15" rx="10" fill="#dcd8e2" opacity="0.45"/>
    <path d="M82,100 Q104,110 126,100 L126,110 Q104,118 82,110 Z" fill="#5c5866"/>

    <!-- studded leather shoulder/chest reinforcement (new for rank 2) -->
    <path d="M84,59 Q104,50 124,59 L123,71 Q104,64 85,71 Z" fill="#5c5866"/>
    <circle cx="90" cy="63" r="2.2" fill="#b8925a"/>
    <circle cx="104" cy="58" r="2.2" fill="#b8925a"/>
    <circle cx="118" cy="63" r="2.2" fill="#b8925a"/>
    <path d="M86,73 Q104,80 122,73 L121,80 Q104,86 87,80 Z" fill="#5c5866"/>
    <circle cx="95" cy="77" r="2" fill="#b8925a"/>
    <circle cx="113" cy="77" r="2" fill="#b8925a"/>

    <!-- belt -->
    <rect x="80" y="106" width="48" height="8" rx="3" fill="#413d48"/>
    <rect x="99" y="105" width="10" height="10" rx="2" fill="#dcd8e2"/>

    <!-- neck -->
    <rect x="102" y="48" width="12" height="8" fill="#e0b088"/>

    <!-- head with simple hood -->
    <circle cx="108" cy="38" r="14" fill="#e0b088"/>
    <path d="M90,44 Q86,14 108,12 Q130,14 126,44 Z" fill="#706c78"/>
    <path d="M94,44 Q92,22 108,20 Q124,22 122,44 Q124,32 108,28 Q92,32 94,44 Z" fill="#1f2430"/>
    <path d="M96,42 Q108,48 120,42 L120,46 Q108,52 96,46 Z" fill="#141821"/>
    <path d="M92,20 L78,8 L96,18 Z" fill="#5c5866"/>
    <ellipse cx="101" cy="22" rx="6" ry="3" fill="#dcd8e2" opacity="0.5"/>
  </g>

  <g id="weapon-arm">
    <!-- draw arm: hand pulled back with the nocked arrow -->
    <path d="M98,66 Q92,74 96,82 Q99,88 106,86 L112,82 Q110,74 104,68 Z" fill="#5c5866"/>
    <circle cx="114" cy="80" r="6" fill="#e0b088"/>

    <!-- nocked arrow -->
    <line x1="110" y1="80" x2="178" y2="80" stroke="#dcd8e2" stroke-width="3" stroke-linecap="round"/>
    <polygon points="178,80 169,75 169,85" fill="#413d48"/>
    <polygon points="110,80 118,75 118,85" fill="#706c78"/>

    <!-- recurve longbow: taller and more purposeful than rank 1's short bow -->
    <path d="M148,17 Q131,29 140,44 Q173,80 140,116 Q131,131 148,143" fill="none" stroke="#5c4a35" stroke-width="7" stroke-linecap="round"/>
    <path d="M146,19 Q133,29 141,43 Q168,80 141,117 Q133,131 146,141" fill="none" stroke="#9c7a52" stroke-width="2" stroke-linecap="round"/>
    <line x1="148" y1="17" x2="120" y2="80" stroke="#e8e4ee" stroke-width="1.3"/>
    <line x1="148" y1="143" x2="120" y2="80" stroke="#e8e4ee" stroke-width="1.3"/>
    <circle cx="148" cy="17" r="3" fill="#b8925a"/>
    <circle cx="148" cy="143" r="3" fill="#b8925a"/>

    <!-- bow-hand arm gripping the bow -->
    <path d="M120,64 Q136,64 142,76 Q144,82 138,84 L133,80 Q128,70 116,70 Z" fill="#9a96a3"/>
    <circle cx="141" cy="79" r="6" fill="#e0b088"/>
    <rect x="137" y="76" width="8" height="8" rx="2" fill="#413d48"/>
    <rect x="135" y="70" width="11" height="6" rx="2" fill="#b8925a"/>
  </g>

  <!-- rank badge (bottom-right, clear of the bow and arrow) -->
  <g id="rank-badge">
    <circle cx="178" cy="176" r="11" fill="#0b0e12"/>
    <text x="178" y="181" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">2</text>
  </g>
</svg>
