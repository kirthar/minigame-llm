<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Archer, Rank 3 / Tier 3 "Late Medieval / Renaissance" — right-facing archer, heavy crossbow with prod and stirrup, steel vambraces + small pauldron -->

  <ellipse cx="100" cy="188" rx="40" ry="7" fill="#000000" opacity="0.25"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) leg -->
      <path d="M91,112 L87,156 Q86,167 93,169 L103,169 Q105,165 101,159 L100,112 Z" fill="#38343f"/>
      <ellipse cx="95" cy="173" rx="10" ry="6" fill="#232733"/>

      <!-- front (leading) leg -->
      <path d="M113,112 L128,150 Q131,163 122,168 L108,168 Q105,163 110,155 L111,112 Z" fill="#5c5866"/>
      <ellipse cx="119" cy="172" rx="11" ry="7" fill="#232733"/>
      <ellipse cx="118" cy="138" rx="8" ry="5" fill="#eceaf0" opacity="0.45"/>
    </g>

    <!-- quiver on the back, still arrow-based motif kept as a side quiver, gold band -->
    <g transform="rotate(-13 73 74)">
      <rect x="65" y="50" width="15" height="47" rx="7" fill="#5c4a3a"/>
      <rect x="65" y="50" width="6" height="47" rx="3" fill="#46362a"/>
      <rect x="64" y="66" width="17" height="4" fill="#c9a227"/>
    </g>
    <line x1="65" y1="53" x2="58" y2="29" stroke="#eceaf0" stroke-width="3" stroke-linecap="round"/>
    <line x1="71" y1="50" x2="68" y2="24" stroke="#eceaf0" stroke-width="3" stroke-linecap="round"/>
    <line x1="77" y1="52" x2="79" y2="27" stroke="#eceaf0" stroke-width="3" stroke-linecap="round"/>
    <polygon points="58,29 53,23 61,25" fill="#5c5866"/>
    <polygon points="68,24 63,18 72,20" fill="#5c5866"/>
    <polygon points="79,27 75,20 84,23" fill="#5c5866"/>

    <!-- faction sash: sole army-accent element (diagonal chest strap), unchanged position/shape -->
    <polygon id="army-accent" fill="#4da3ff" points="90,57 100,57 122,105 112,110"/>

    <!-- torso: tier-3 palette -->
    <rect x="82" y="58" width="44" height="52" rx="14" fill="#5c5866"/>
    <rect x="84" y="60" width="40" height="15" rx="10" fill="#eceaf0" opacity="0.45"/>
    <path d="M82,100 Q104,110 126,100 L126,110 Q104,118 82,110 Z" fill="#38343f"/>

    <!-- studded reinforcement carried over from rank 2, gold filigree trim now -->
    <path d="M84,59 Q104,50 124,59 L123,71 Q104,64 85,71 Z" fill="#38343f"/>
    <path d="M84,59 Q104,50 124,59" fill="none" stroke="#c9a227" stroke-width="1.3"/>
    <path d="M86,73 Q104,80 122,73 L121,80 Q104,86 87,80 Z" fill="#38343f"/>
    <path d="M86,73 Q104,80 122,73" fill="none" stroke="#c9a227" stroke-width="1.3"/>

    <!-- small steel pauldron on the bow-arm shoulder -->
    <path d="M118,54 Q132,50 138,60 Q136,68 126,68 Q118,64 118,54 Z" fill="#5c5866"/>
    <path d="M118,54 Q132,50 138,60" fill="none" stroke="#c9a227" stroke-width="1.3"/>
    <ellipse cx="128" cy="58" rx="6" ry="3" fill="#eceaf0" opacity="0.4"/>

    <!-- belt -->
    <rect x="80" y="106" width="48" height="8" rx="3" fill="#38343f"/>
    <rect x="99" y="105" width="10" height="10" rx="2" fill="#eceaf0"/>

    <!-- neck -->
    <rect x="102" y="48" width="12" height="8" fill="#e0b088"/>

    <!-- head with hood -->
    <circle cx="108" cy="38" r="14" fill="#e0b088"/>
    <path d="M90,44 Q86,14 108,12 Q130,14 126,44 Z" fill="#5c5866"/>
    <path d="M94,44 Q92,22 108,20 Q124,22 122,44 Q124,32 108,28 Q92,32 94,44 Z" fill="#1f2430"/>
    <path d="M96,42 Q108,48 120,42 L120,46 Q108,52 96,46 Z" fill="#141821"/>
    <path d="M92,20 L78,8 L96,18 Z" fill="#38343f"/>
    <ellipse cx="101" cy="22" rx="6" ry="3" fill="#eceaf0" opacity="0.5"/>
  </g>

  <g id="weapon-arm">
    <!-- draw arm / trigger hand, steel vambrace over forearm -->
    <path d="M98,66 Q92,74 96,82 Q99,88 106,86 L112,82 Q110,74 104,68 Z" fill="#5c5866"/>
    <rect x="97" y="71" width="13" height="9" rx="3" fill="#5c5866" stroke="#c9a227" stroke-width="1"/>
    <circle cx="114" cy="80" r="6" fill="#e0b088"/>

    <!-- crossbow stock (tiller), boxy vs. the bow curves of ranks 1-2 -->
    <rect x="112" y="76" width="64" height="9" rx="2" fill="#38343f"/>
    <line x1="114" y1="76.5" x2="174" y2="76.5" stroke="#c9a227" stroke-width="1"/>
    <line x1="114" y1="84.5" x2="174" y2="84.5" stroke="#c9a227" stroke-width="1"/>

    <!-- trigger mechanism box -->
    <rect x="108" y="80" width="10" height="15" rx="2" fill="#38343f"/>
    <path d="M110,95 Q108,101 113,102 L116,98 Q114,95 110,95 Z" fill="#5c5866"/>

    <!-- stirrup at the front tip, for foot-reload -->
    <path d="M172,80 Q186,84 184,96 Q180,104 172,98" fill="none" stroke="#38343f" stroke-width="4" stroke-linecap="round"/>

    <!-- bolt: short and thick vs. rank 1/2's long arrow -->
    <line x1="118" y1="80" x2="163" y2="80" stroke="#eceaf0" stroke-width="4" stroke-linecap="round"/>
    <polygon points="163,80 155,75 155,85" fill="#38343f"/>
    <polygon points="118,80 125,76 125,84" fill="#5c5866"/>

    <!-- prod (crossbow bow-arms): angular silhouette, not a curved bow -->
    <path d="M163,44 L168,80 L163,116" fill="none" stroke="#5c5866" stroke-width="8" stroke-linecap="round"/>
    <path d="M163,44 L168,80 L163,116" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    <line x1="163" y1="44" x2="163" y2="116" stroke="#eceaf0" stroke-width="1.3"/>

    <!-- bow-hand arm gripping the fore-stock, steel vambrace -->
    <path d="M120,64 Q136,64 142,76 Q144,82 138,84 L133,80 Q128,70 116,70 Z" fill="#706c78"/>
    <rect x="119" y="67" width="14" height="10" rx="3" fill="#5c5866" stroke="#c9a227" stroke-width="1"/>
    <circle cx="141" cy="79" r="6" fill="#e0b088"/>
    <rect x="137" y="76" width="8" height="8" rx="2" fill="#38343f"/>
  </g>

  <!-- rank badge (bottom-right, clear of the crossbow) -->
  <g id="rank-badge">
    <circle cx="178" cy="176" r="11" fill="#0b0e12"/>
    <text x="178" y="181" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">3</text>
  </g>
</svg>
