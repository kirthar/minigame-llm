<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy Infantry, Rank 3 / Tier 3 "Tardomedieval/renacentista" — full-coverage plate, tower shield -->
  <ellipse cx="102" cy="188" rx="50" ry="8" fill="#000000" opacity="0.25"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) leg — greaved -->
      <path d="M74,112 L98,112 L94,172 Q93,180 85,180 L77,180 Q70,180 72,172 Z" fill="#38343f"/>
      <ellipse cx="83" cy="182" rx="13" ry="7" fill="#232733"/>
      <path d="M75,130 L97,130 L96,140 L76,140 Z" fill="#5c5866" opacity="0.7"/>
      <path d="M75,150 L96,150 L95,160 L76,160 Z" fill="#5c5866" opacity="0.7"/>

      <!-- front (leading) leg — greaved -->
      <path d="M104,108 L132,108 L138,176 Q139,184 130,184 L114,184 Q107,184 108,176 Z" fill="#5c5866"/>
      <ellipse cx="122" cy="186" rx="15" ry="7" fill="#232733"/>
      <path d="M106,128 L134,128 L133,140 L107,140 Z" fill="#eceaf0" opacity="0.25"/>
      <path d="M108,150 L133,150 L132,162 L109,162 Z" fill="#38343f" opacity="0.4"/>

      <ellipse cx="118" cy="138" rx="10" ry="6" fill="#eceaf0" opacity="0.4"/>
      <circle cx="83" cy="140" r="6" fill="#38343f"/>
      <circle cx="83" cy="140" r="6" fill="none" stroke="#c9a227" stroke-width="1.5"/>
      <circle cx="122" cy="136" r="6" fill="#5c5866"/>
      <circle cx="122" cy="136" r="6" fill="none" stroke="#c9a227" stroke-width="1.5"/>
    </g>

    <!-- full plate breastplate, fluted -->
    <rect x="58" y="62" width="80" height="30" rx="14" fill="#5c5866"/>
    <path d="M98,62 L98,92 M78,64 Q78,78 82,90 M138,64 Q138,78 134,90" stroke="#38343f" stroke-width="2" fill="none" opacity="0.5"/>
    <ellipse cx="78" cy="72" rx="18" ry="8" fill="#eceaf0" opacity="0.4"/>
    <rect x="58" y="90" width="80" height="20" rx="10" fill="#38343f"/>
    <!-- tassets (hip plates) -->
    <path d="M60,108 L80,108 L78,124 L62,124 Z" fill="#5c5866"/>
    <path d="M116,108 L136,108 L138,124 L118,124 Z" fill="#5c5866"/>
    <path d="M54,104 Q98,116 142,104 L142,128 Q98,140 54,128 Z" fill="#2f2b36"/>
    <path d="M60,64 Q98,72 136,64" stroke="#c9a227" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M60,90 Q98,98 136,90" stroke="#c9a227" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- larger layered pauldrons -->
    <ellipse cx="60" cy="70" rx="15" ry="13" fill="#5c5866"/>
    <ellipse cx="60" cy="80" rx="12" ry="9" fill="#38343f"/>
    <ellipse cx="136" cy="70" rx="15" ry="13" fill="#5c5866"/>
    <ellipse cx="136" cy="80" rx="12" ry="9" fill="#38343f"/>
    <circle cx="60" cy="68" r="2" fill="#c9a227"/>
    <circle cx="136" cy="68" r="2" fill="#c9a227"/>

    <!-- gauntlet on visible forearm base -->
    <ellipse cx="128" cy="66" rx="8" ry="7" fill="#5c5866"/>
    <path d="M122,62 Q128,58 134,62" stroke="#c9a227" stroke-width="1.2" fill="none"/>

    <!-- army accent: sash over plate -->
    <path id="army-accent" fill="#4da3ff" d="M60,64 Q52,90 68,118 L84,112 Q70,90 78,66 Z"/>
    <ellipse cx="68" cy="88" rx="7" ry="17" fill="#ffffff" opacity="0.18"/>

    <!-- belt -->
    <rect x="56" y="100" width="84" height="9" rx="3" fill="#232733"/>
    <rect x="93" y="101" width="14" height="8" rx="2" fill="#c9a227"/>

    <!-- neck -->
    <rect x="100" y="50" width="16" height="12" fill="#e0b088"/>

    <!-- head -->
    <circle cx="108" cy="40" r="16" fill="#e0b088"/>
    <path d="M94,44 Q92,26 108,24 Q124,26 122,44 Q108,36 94,44 Z" fill="#c8935f"/>

    <!-- closed/visored helm, eyes still peek through slit -->
    <path d="M88,42 Q86,14 108,12 Q130,14 128,42 Q128,28 108,26 Q88,28 88,42 Z" fill="#5c5866"/>
    <path d="M86,38 Q108,50 130,38 L130,48 Q108,58 86,48 Z" fill="#38343f"/>
    <rect x="104" y="36" width="8" height="20" fill="#38343f"/>
    <ellipse cx="108" cy="44" rx="15" ry="4" fill="#16213a" opacity="0.7"/>
    <ellipse cx="99" cy="22" rx="6" ry="4" fill="#eceaf0" opacity="0.5"/>
    <path d="M88,32 Q108,38 128,32" stroke="#c9a227" stroke-width="2" fill="none"/>
    <path d="M108,12 Q100,5 103,2 Q109,6 109,10 Q109,6 114,2 Q117,5 108,12 Z" fill="#8a2f2f"/>
    <path d="M108,12 Q100,5 103,2 Q109,6 109,10 Q109,6 114,2 Q117,5 108,12 Z" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.6"/>
  </g>

  <g id="shield">
    <!-- tower shield: taller, replaces round iron shield in same slot -->
    <path d="M80,80 L146,80 Q148,120 140,150 Q130,168 113,172 Q96,168 86,150 Q78,120 80,80 Z" fill="#2f2b36"/>
    <path d="M85,84 L141,84 Q143,118 136,146 Q127,162 113,166 Q99,162 90,146 Q83,118 85,84 Z" fill="#5c5866"/>
    <path d="M85,84 L141,84 Q143,118 136,146 L90,146 Q83,118 85,84 Z" fill="#eceaf0" opacity="0.25"/>
    <path d="M85,84 L141,84 Q143,118 136,146 Q127,162 113,166 Q99,162 90,146 Q83,118 85,84 Z" fill="none" stroke="#c9a227" stroke-width="2"/>
    <line x1="113" y1="88" x2="113" y2="160" stroke="#c9a227" stroke-width="1.5" opacity="0.7"/>
    <circle cx="113" cy="120" r="11" fill="#38343f"/>
    <circle cx="113" cy="120" r="6" fill="#c9a227"/>
    <ellipse cx="98" cy="98" rx="8" ry="5" fill="#ffffff" opacity="0.15"/>
  </g>

  <g id="weapon-arm">
    <!-- warhammer -->
    <path d="M126,68 Q146,66 156,50 Q160,42 168,32" stroke="#38343f" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M126,68 Q146,66 154,54" stroke="#2f2b36" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.5"/>
    <circle cx="168" cy="32" r="8" fill="#e0b088"/>
    <rect x="164" y="8" width="7" height="28" rx="3" fill="#38343f" transform="rotate(20 168 32)"/>
    <g transform="translate(180,10) rotate(20)">
      <rect x="-13" y="-7" width="26" height="14" rx="3" fill="#5c5866"/>
      <rect x="-13" y="-7" width="26" height="14" rx="3" fill="none" stroke="#c9a227" stroke-width="1.5"/>
      <path d="M13,0 L22,-4 L22,4 Z" fill="#38343f"/>
    </g>
  </g>

  <g id="rank-badge">
    <circle cx="24" cy="26" r="11" fill="#0b0e12"/>
    <text x="24" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">3</text>
  </g>
</svg>
