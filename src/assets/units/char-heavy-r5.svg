<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Heavy Infantry, Rank 5 / Tier 5 "Sci-fi" — power armor / assault mech, integrated energy barrier & cannon -->
  <ellipse cx="102" cy="188" rx="52" ry="9" fill="#000000" opacity="0.3"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) mech leg -->
      <path d="M70,110 L102,110 L96,174 Q95,182 86,182 L76,182 Q68,182 70,174 Z" fill="#4d545c"/>
      <ellipse cx="83" cy="184" rx="15" ry="8" fill="#232733"/>
      <path d="M72,132 L100,132 L98,148 L74,148 Z" fill="#9aa4ad"/>
      <circle cx="86" cy="140" r="3" fill="#4d545c"/>

      <!-- front (leading) mech leg, bulkier -->
      <path d="M100,106 L136,106 L142,178 Q143,186 133,186 L116,186 Q108,186 110,178 Z" fill="#9aa4ad"/>
      <ellipse cx="124" cy="188" rx="17" ry="8" fill="#232733"/>
      <path d="M104,130 L136,130 L134,148 L107,148 Z" fill="#c9d3da" opacity="0.5"/>
      <circle cx="120" cy="138" r="3" fill="#4d545c"/>

      <ellipse cx="118" cy="140" rx="12" ry="7" fill="#c9d3da" opacity="0.35"/>
    </g>

    <!-- bulky power-armor torso (largest silhouette growth of the batch) -->
    <rect x="52" y="58" width="92" height="34" rx="12" fill="#9aa4ad"/>
    <path d="M56,62 L140,62 L134,88 L62,88 Z" fill="#4d545c"/>
    <rect x="92" y="66" width="16" height="8" rx="2" fill="#c9d3da"/>
    <rect x="52" y="92" width="92" height="20" rx="8" fill="#4d545c"/>
    <path d="M48,106 Q98,118 148,106 L148,132 Q98,144 48,132 Z" fill="#2b2f33"/>

    <!-- large chrome pauldrons w/ thruster vents -->
    <path d="M40,60 L74,56 L76,84 L44,90 Z" fill="#9aa4ad"/>
    <path d="M42,64 L70,60 L71,78 L46,84 Z" fill="#c9d3da" opacity="0.4"/>
    <circle cx="50" cy="80" r="3" fill="#4d545c"/>
    <path d="M122,56 L156,60 L158,90 L124,84 Z" fill="#9aa4ad"/>
    <path d="M126,60 L152,64 L151,80 L125,78 Z" fill="#c9d3da" opacity="0.4"/>
    <circle cx="146" cy="80" r="3" fill="#4d545c"/>

    <!-- belt / core housing -->
    <rect x="50" y="102" width="96" height="10" rx="3" fill="#232733"/>
    <rect x="92" y="103" width="16" height="8" rx="2" fill="#9aa4ad"/>

    <!-- neck -->
    <rect x="98" y="48" width="20" height="12" fill="#4d545c"/>

    <!-- fully enclosed helm, no visible skin -->
    <circle cx="108" cy="38" r="18" fill="#9aa4ad"/>
    <path d="M90,42 Q88,14 108,12 Q128,14 126,42 Q126,26 108,24 Q90,26 90,42 Z" fill="#4d545c"/>
    <path d="M88,38 Q108,50 128,38 L128,50 Q108,62 88,50 Z" fill="#2b2f33"/>
    <!-- glowing visor slit: unit's own bio-glow, independent of army-accent -->
    <rect x="92" y="36" width="32" height="7" rx="3" fill="#bfe6ff"/>
    <rect x="92" y="36" width="32" height="7" rx="3" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.8"/>
    <ellipse cx="108" cy="39" rx="20" ry="8" fill="#bfe6ff" opacity="0.2"/>
  </g>

  <g id="shield">
    <!-- integrated energy barrier: army-accent is now a glow (outer soft glow + bright core) -->
    <path d="M78,84 Q140,74 148,112 Q152,152 114,170 Q84,154 76,114 Z" fill="#2b2f33"/>
    <ellipse cx="112" cy="122" rx="42" ry="52" fill="#4da3ff" opacity="0.18"/>
    <path id="army-accent" fill="#4da3ff" d="M86,90 Q136,82 142,112 Q146,146 113,160 Q90,148 84,114 Z" opacity="0.55"/>
    <path d="M86,90 Q136,82 142,112 Q146,146 113,160 Q90,148 84,114 Z" fill="none" stroke="#c9d3da" stroke-width="2" opacity="0.8"/>
    <circle cx="113" cy="120" r="10" fill="#eaf6ff" opacity="0.85"/>
  </g>

  <g id="weapon-arm">
    <!-- integrated cannon replaces hand-held weapon -->
    <path d="M126,66 Q148,64 158,48 Q162,40 170,30" stroke="#4d545c" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M126,66 Q148,64 156,52" stroke="#2b2f33" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.5"/>
    <g transform="translate(178,20) rotate(20)">
      <rect x="-8" y="-10" width="34" height="20" rx="4" fill="#9aa4ad"/>
      <rect x="-8" y="-10" width="34" height="20" rx="4" fill="none" stroke="#4d545c" stroke-width="1.5"/>
      <circle cx="20" cy="0" r="6" fill="#bfe6ff"/>
      <circle cx="20" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
      <rect x="-16" y="-4" width="10" height="8" rx="2" fill="#4d545c"/>
    </g>
  </g>

  <g id="rank-badge">
    <circle cx="24" cy="26" r="11" fill="#0b0e12"/>
    <text x="24" y="31" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">5</text>
  </g>
</svg>
