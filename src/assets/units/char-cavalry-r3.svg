<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Cavalry - Rank 3 (Tardomedieval / Renacentista)</title>

  <!-- ground contact shadow -->
  <ellipse cx="104" cy="193" rx="78" ry="6" fill="#0b0e12" opacity="0.3"/>

  <!-- ===================== HORSE LEGS ===================== -->
  <g id="legs">
    <rect x="56" y="150" width="16" height="34" rx="6" fill="#5f4632"/>
    <rect x="56" y="182" width="16" height="10" rx="4" fill="#241a12"/>
    <rect x="112" y="150" width="16" height="34" rx="6" fill="#5f4632"/>
    <rect x="112" y="182" width="16" height="10" rx="4" fill="#241a12"/>
    <rect x="72" y="152" width="16" height="36" rx="6" fill="#8a6a4a"/>
    <rect x="72" y="186" width="16" height="10" rx="4" fill="#2a1e14"/>
    <rect x="128" y="152" width="16" height="36" rx="6" fill="#8a6a4a"/>
    <rect x="128" y="186" width="16" height="10" rx="4" fill="#2a1e14"/>
  </g>

  <!-- ===================== HORSE BODY (torso, neck, head under full steel barding) ===================== -->
  <g id="body">
    <!-- tail -->
    <path d="M52,100 C36,96 26,110 30,130 C32,144 42,150 52,146 C46,130 46,114 52,100 Z" fill="#3d2b1f"/>

    <!-- torso -->
    <rect x="48" y="96" width="100" height="58" rx="26" fill="#8a6a4a"/>
    <rect x="48" y="134" width="100" height="22" rx="20" fill="#5f4632" opacity="0.9"/>
    <ellipse cx="88" cy="106" rx="32" ry="10" fill="#b8926a" opacity="0.55"/>

    <!-- full steel flanchard barding over torso, tier-3 palette -->
    <path d="M48,98 L148,98 L148,150 L48,150 Z" fill="#5c5866"/>
    <path d="M48,98 L148,98 L146,110 L50,110 Z" fill="#38343f" opacity="0.5"/>
    <!-- muted gold filigree engraving -->
    <rect x="52" y="120" width="92" height="2" fill="#c9a227"/>
    <rect x="52" y="132" width="92" height="2" fill="#c9a227"/>
    <path d="M52,102 L144,102" stroke="#c9a227" stroke-width="1.5" fill="none"/>

    <!-- crinière neck armor (was bare neck) -->
    <polygon points="146,58 128,102 152,110 172,55" fill="#5c5866"/>
    <polygon points="146,58 172,55 166,66 150,70" fill="#eceaf0" opacity="0.5"/>
    <rect x="140" y="60" width="30" height="4" fill="#c9a227" opacity="0.8" transform="rotate(60 155 62)"/>

    <!-- segmented neck plates (was mane tufts) -->
    <rect x="140" y="58" width="8" height="14" rx="3" fill="#38343f"/>
    <rect x="134" y="72" width="8" height="14" rx="3" fill="#38343f"/>
    <rect x="128" y="86" width="8" height="14" rx="3" fill="#38343f"/>

    <!-- chanfron head-plate (was bare head) -->
    <polygon points="168,34 163,19 177,32" fill="#38343f"/>
    <rect x="160" y="34" width="38" height="24" rx="10" fill="#5c5866"/>
    <rect x="186" y="42" width="14" height="14" rx="6" fill="#38343f"/>
    <rect x="176" y="30" width="4" height="26" fill="#c9a227" opacity="0.8"/>
    <ellipse cx="195" cy="49" rx="2" ry="1.5" fill="#111111"/>

    <!-- saddle-cloth army-accent, still shown proud over the steel barding, same position throughline -->
    <path id="army-accent" fill="#4da3ff" d="M82,96 L140,96 L138,114 L118,120 L100,120 L82,114 Z"/>
  </g>

  <!-- ===================== RIDER (full plate armor) ===================== -->
  <g id="rider">
    <rect x="96" y="98" width="24" height="20" rx="10" fill="#38343f"/>
    <rect x="114" y="100" width="18" height="26" rx="8" fill="#5c5866"/>
    <rect x="116" y="122" width="16" height="16" rx="6" fill="#38343f"/>

    <rect x="90" y="54" width="32" height="48" rx="13" fill="#5c5866"/>
    <rect x="90" y="54" width="13" height="48" rx="13" fill="#38343f" opacity="0.85"/>
    <ellipse cx="108" cy="66" rx="9" ry="6" fill="#eceaf0" opacity="0.6"/>
    <rect x="90" y="94" width="32" height="6" rx="3" fill="#38343f"/>
    <!-- gold filigree -->
    <rect x="92" y="64" width="28" height="2" fill="#c9a227"/>
    <rect x="92" y="80" width="28" height="2" fill="#c9a227"/>

    <!-- full pauldrons -->
    <ellipse cx="118" cy="56" rx="13" ry="10" fill="#5c5866"/>
    <ellipse cx="118" cy="56" rx="13" ry="10" fill="none" stroke="#c9a227" stroke-width="2"/>
    <ellipse cx="93" cy="60" rx="10" ry="8" fill="#5c5866"/>

    <rect x="101" y="46" width="10" height="10" fill="#d9a066"/>
    <circle cx="106" cy="36" r="14" fill="#d9a066"/>
    <ellipse cx="106" cy="42" rx="8" ry="4" fill="#b9804a" opacity="0.5"/>

    <!-- full great helm (visor raised, face still visible) -->
    <rect x="92" y="18" width="28" height="22" rx="8" fill="#5c5866"/>
    <rect x="92" y="18" width="10" height="22" rx="8" fill="#38343f" opacity="0.7"/>
    <rect x="100" y="26" width="12" height="3" fill="#111111"/>
    <rect x="92" y="36" width="28" height="3" fill="#c9a227"/>
  </g>

  <!-- ===================== WEAPON ARM + JOUSTING LANCE (vamplate) ===================== -->
  <g id="weapon-arm">
    <polygon points="114,54 116,68 146,63 150,53" fill="#5c5866"/>
    <circle cx="148" cy="58" r="6" fill="#d9a066"/>
    <g transform="translate(148,58) rotate(-18)">
      <rect x="0" y="-4" width="50" height="8" rx="3" fill="#6b4a30"/>
      <rect x="2" y="-2" width="46" height="2" fill="#8a6a4a" opacity="0.6"/>
      <circle cx="14" cy="0" r="9" fill="#5c5866"/>
      <circle cx="14" cy="0" r="9" fill="none" stroke="#c9a227" stroke-width="1.5"/>
      <polygon points="46,-6 60,0 46,6" fill="#eceaf0"/>
      <polygon points="46,-3 54,0 46,3" fill="#5c5866"/>
    </g>
  </g>

  <!-- ===================== RANK BADGE ===================== -->
  <g id="rank-badge">
    <circle cx="97" cy="62" r="10" fill="#0b0e12"/>
    <text x="97" y="62" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3">3</text>
  </g>
</svg>
