<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Light Infantry, Rank 1 / Tier 1 "Early Medieval" — right-facing skirmisher -->

  <!-- ground contact shadow -->
  <ellipse cx="100" cy="188" rx="40" ry="7" fill="#000000" opacity="0.25"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) leg -->
      <path d="M90,110 L87,155 Q86,166 93,168 L103,168 Q105,164 101,158 L99,110 Z" fill="#4a4652"/>
      <ellipse cx="95" cy="172" rx="10" ry="6" fill="#232733"/>

      <!-- front (leading) leg -->
      <path d="M114,110 L126,152 Q129,164 121,168 L109,168 Q106,164 110,156 L112,110 Z" fill="#6b6774"/>
      <ellipse cx="118" cy="172" rx="11" ry="7" fill="#232733"/>
      <ellipse cx="116" cy="140" rx="8" ry="5" fill="#c7c3ce" opacity="0.45"/>
    </g>

    <!-- short traveling cloak: sole army-accent element -->
    <path id="army-accent" fill="#4da3ff"
      d="M90,56 Q58,68 62,118 Q65,148 88,158 L96,142 Q76,120 80,88 Q83,68 100,58 Z"/>

    <!-- torso: light leather tunic -->
    <rect x="82" y="56" width="46" height="54" rx="14" fill="#8a8694"/>
    <rect x="84" y="58" width="42" height="16" rx="10" fill="#c7c3ce" opacity="0.45"/>
    <path d="M82,98 Q105,108 128,98 L128,110 Q105,118 82,110 Z" fill="#6b6774"/>

    <!-- belt -->
    <rect x="80" y="106" width="50" height="8" rx="3" fill="#4a4652"/>
    <rect x="99" y="105" width="10" height="10" rx="2" fill="#c7c3ce"/>

    <!-- off-arm with small round buckler (mobility over protection) -->
    <path d="M88,62 Q70,78 68,104 Q67,111 74,113 L82,108 Q80,88 94,68 Z" fill="#8a8694"/>
    <circle cx="66" cy="108" r="12" fill="#6b6774"/>
    <circle cx="66" cy="108" r="8" fill="#8a8694"/>
    <ellipse cx="63" cy="104" rx="4" ry="3" fill="#c7c3ce" opacity="0.55"/>

    <!-- neck -->
    <rect x="102" y="48" width="12" height="8" fill="#e0b088"/>

    <!-- head -->
    <circle cx="108" cy="38" r="14" fill="#e0b088"/>
    <path d="M92,40 Q90,20 108,18 Q126,20 124,40 Q124,28 108,26 Q94,28 92,40 Z" fill="#1f2430"/>
    <path d="M96,42 Q108,48 120,42 L120,46 Q108,52 96,46 Z" fill="#141821"/>
    <ellipse cx="103" cy="26" rx="5" ry="3" fill="#4a5468" opacity="0.6"/>
  </g>

  <g id="weapon-arm">
    <path d="M120,64 Q144,66 154,84 Q157,91 149,94 L142,89 Q136,76 116,72 Z" fill="#9a96a3"/>
    <circle cx="150" cy="90" r="6" fill="#e0b088"/>
    <path d="M150,85 L173,79 L175,83 L153,90 Z" fill="#c7c3ce"/>
    <rect x="145" y="86" width="9" height="6" rx="2" fill="#4a4652"/>
  </g>

  <!-- rank badge (top-right, clear of the weapon reach) -->
  <g id="rank-badge">
    <circle cx="176" cy="32" r="11" fill="#0b0e12"/>
    <text x="176" y="37" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">1</text>
  </g>
</svg>
