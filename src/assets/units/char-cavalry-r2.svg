<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>Cavalry - Rank 2 (Medieval Clásico)</title>

  <!-- ground contact shadow -->
  <ellipse cx="104" cy="193" rx="78" ry="6" fill="#0b0e12" opacity="0.3"/>

  <!-- ===================== HORSE LEGS ===================== -->
  <g id="legs">
    <rect x="56" y="150" width="16" height="34" rx="6" fill="#5f4632"/>
    <rect x="56" y="182" width="16" height="10" rx="4" fill="#241a12"/>
    <rect x="112" y="150" width="16" height="34" rx="6" fill="#5f4632"/>
    <rect x="112" y="182" width="16" height="10" rx="4" fill="#241a12"/>
    <rect x="72" y="152" width="16" height="36" rx="6" fill="#8a6a4a"/>
    <rect x="72" y="186" width="16" height="10" rx="4" fill="#2a1e14"/>
    <rect x="128" y="152" width="16" height="36" rx="6" fill="#8a6a4a"/>
    <rect x="128" y="186" width="16" height="10" rx="4" fill="#2a1e14"/>
  </g>

  <!-- ===================== HORSE BODY (torso, neck, head, tail, light barding) ===================== -->
  <g id="body">
    <!-- tail -->
    <path d="M52,100 C36,96 26,110 30,130 C32,144 42,150 52,146 C46,130 46,114 52,100 Z" fill="#3d2b1f"/>

    <!-- torso -->
    <rect x="48" y="96" width="100" height="58" rx="26" fill="#8a6a4a"/>
    <rect x="48" y="134" width="100" height="22" rx="20" fill="#5f4632" opacity="0.9"/>
    <ellipse cx="88" cy="106" rx="32" ry="10" fill="#b8926a" opacity="0.55"/>

    <!-- light barding: cloth/leather drape over chest + hindquarter, tier-2 palette -->
    <path d="M50,100 L96,98 L92,140 L52,148 Z" fill="#706c78"/>
    <path d="M50,100 L96,98 L94,112 L54,118 Z" fill="#413d48" opacity="0.5"/>
    <path d="M118,98 L146,96 L146,150 L122,140 Z" fill="#706c78"/>
    <path d="M118,98 L146,96 L144,108 L120,112 Z" fill="#413d48" opacity="0.5"/>
    <!-- brass trim hems -->
    <rect x="50" y="144" width="44" height="4" rx="2" fill="#b8925a"/>
    <rect x="120" y="146" width="26" height="4" rx="2" fill="#b8925a"/>

    <!-- neck (bare, light leather collar) -->
    <polygon points="146,58 128,102 152,110 172,55" fill="#8a6a4a"/>
    <polygon points="146,58 172,55 166,66 150,70" fill="#b8926a" opacity="0.5"/>
    <rect x="144" y="70" width="16" height="6" rx="3" fill="#706c78"/>

    <!-- mane tufts -->
    <polygon points="158,42 148,28 168,40" fill="#3d2b1f"/>
    <rect x="140" y="58" width="8" height="14" rx="4" fill="#3d2b1f"/>
    <rect x="134" y="72" width="8" height="14" rx="4" fill="#3d2b1f"/>
    <rect x="128" y="86" width="8" height="14" rx="4" fill="#3d2b1f"/>

    <!-- head (bare, unarmored) -->
    <polygon points="168,34 163,19 177,32" fill="#5f4632"/>
    <rect x="160" y="34" width="38" height="24" rx="10" fill="#8a6a4a"/>
    <rect x="186" y="42" width="14" height="14" rx="6" fill="#5f4632"/>
    <ellipse cx="195" cy="49" rx="2" ry="1.5" fill="#241a12"/>
    <circle cx="176" cy="42" r="2" fill="#241a12"/>

    <!-- saddle-cloth army-accent: peeking out from under the barding, same position as rank 1 -->
    <path id="army-accent" fill="#4da3ff" d="M82,96 L140,96 L138,114 L118,120 L100,120 L82,114 Z"/>
  </g>

  <!-- ===================== RIDER (partial plate armor) ===================== -->
  <g id="rider">
    <rect x="96" y="98" width="24" height="20" rx="10" fill="#413d48"/>
    <rect x="114" y="100" width="18" height="26" rx="8" fill="#706c78"/>
    <rect x="116" y="122" width="16" height="16" rx="6" fill="#413d48"/>

    <rect x="90" y="54" width="32" height="48" rx="13" fill="#706c78"/>
    <rect x="90" y="54" width="13" height="48" rx="13" fill="#413d48" opacity="0.85"/>
    <ellipse cx="108" cy="66" rx="9" ry="6" fill="#dcd8e2" opacity="0.6"/>
    <rect x="90" y="94" width="32" height="6" rx="3" fill="#413d48"/>
    <!-- brass rivet trim -->
    <circle cx="98" cy="62" r="2" fill="#b8925a"/>
    <circle cx="98" cy="78" r="2" fill="#b8925a"/>
    <circle cx="98" cy="92" r="2" fill="#b8925a"/>
    <rect x="90" y="70" width="32" height="3" fill="#b8925a" opacity="0.8"/>

    <!-- pauldron shoulder -->
    <ellipse cx="118" cy="56" rx="12" ry="9" fill="#706c78"/>
    <ellipse cx="118" cy="56" rx="12" ry="9" fill="none" stroke="#b8925a" stroke-width="2"/>

    <rect x="101" y="46" width="10" height="10" fill="#d9a066"/>
    <circle cx="106" cy="36" r="14" fill="#d9a066"/>
    <ellipse cx="106" cy="42" rx="8" ry="4" fill="#b9804a" opacity="0.5"/>

    <!-- open-face helmet -->
    <rect x="92" y="20" width="28" height="18" rx="10" fill="#706c78"/>
    <rect x="92" y="20" width="10" height="18" rx="10" fill="#413d48" opacity="0.7"/>
    <rect x="92" y="36" width="28" height="3" fill="#b8925a"/>
  </g>

  <!-- ===================== WEAPON ARM + LONGER LANCE ===================== -->
  <g id="weapon-arm">
    <polygon points="114,54 116,68 146,63 150,53" fill="#706c78"/>
    <circle cx="148" cy="58" r="6" fill="#d9a066"/>
    <g transform="translate(148,58) rotate(-18)">
      <rect x="0" y="-3" width="46" height="6" rx="3" fill="#6b4a30"/>
      <rect x="2" y="-1.5" width="42" height="1.5" fill="#8a6a4a" opacity="0.6"/>
      <polygon points="44,-7 58,0 44,7" fill="#dcd8e2"/>
      <polygon points="44,-4 52,0 44,4" fill="#706c78"/>
    </g>
  </g>

  <!-- ===================== RANK BADGE ===================== -->
  <g id="rank-badge">
    <circle cx="97" cy="62" r="10" fill="#0b0e12"/>
    <text x="97" y="62" text-anchor="middle" dominant-baseline="central" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3">2</text>
  </g>
</svg>
