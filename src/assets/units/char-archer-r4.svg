<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Archer, Rank 4 / Tier 4 "Modern Transition" — right-facing marksman, early rifle/arquebus, ammo bandolier replacing the quiver, tactical goggles + cap -->

  <ellipse cx="100" cy="188" rx="40" ry="7" fill="#000000" opacity="0.25"/>

  <g id="body">
    <g id="legs">
      <!-- back (trailing) leg -->
      <path d="M91,112 L87,156 Q86,167 93,169 L103,169 Q105,165 101,159 L100,112 Z" fill="#2b2f33"/>
      <ellipse cx="95" cy="173" rx="10" ry="6" fill="#232733"/>

      <!-- front (leading) leg, khaki tactical trouser -->
      <path d="M113,112 L128,150 Q131,163 122,168 L108,168 Q105,163 110,155 L111,112 Z" fill="#6b6558"/>
      <ellipse cx="119" cy="172" rx="11" ry="7" fill="#232733"/>
      <!-- metal knee pad (highlight reserved for metal parts only per tier-4 rule) -->
      <rect x="112" y="133" width="12" height="10" rx="3" fill="#3a3e42"/>
      <rect x="112" y="133" width="12" height="3" fill="#55595e" opacity="0.6"/>
    </g>

    <!-- ammo bandolier on the back, occupying the same screen-space the quiver used to -->
    <g transform="rotate(-13 73 74)">
      <rect x="64" y="50" width="17" height="47" rx="4" fill="#6b6558"/>
      <rect x="64" y="54" width="17" height="5" fill="#2b2f33"/>
      <rect x="64" y="62" width="17" height="5" fill="#2b2f33"/>
      <rect x="64" y="70" width="17" height="5" fill="#2b2f33"/>
      <rect x="64" y="78" width="17" height="5" fill="#2b2f33"/>
      <rect x="64" y="86" width="17" height="5" fill="#2b2f33"/>
    </g>

    <!-- faction strap: sole army-accent element (diagonal chest strap), unchanged position/shape -->
    <polygon id="army-accent" fill="#4da3ff" points="90,57 100,57 122,105 112,110"/>

    <!-- torso: khaki field jacket with matte tactical vest plate -->
    <rect x="82" y="58" width="44" height="52" rx="14" fill="#6b6558"/>
    <path d="M84,60 L124,60 L122,100 Q104,108 84,100 Z" fill="#3a3e42"/>
    <rect x="86" y="62" width="36" height="10" rx="4" fill="#55595e" opacity="0.5"/>
    <path d="M82,100 Q104,110 126,100 L126,110 Q104,118 82,110 Z" fill="#2b2f33"/>

    <!-- small utility pouch w/ amber sensor light -->
    <rect x="100" y="104" width="8" height="6" rx="1" fill="#2b2f33"/>
    <circle cx="104" cy="107" r="1.2" fill="#ffb454"/>

    <!-- belt -->
    <rect x="80" y="106" width="48" height="8" rx="3" fill="#2b2f33"/>
    <rect x="99" y="105" width="10" height="10" rx="2" fill="#55595e"/>

    <!-- neck -->
    <rect x="102" y="48" width="12" height="8" fill="#e0b088"/>

    <!-- head: cap + tactical goggles replace the hood -->
    <circle cx="108" cy="38" r="14" fill="#e0b088"/>
    <path d="M90,40 Q86,14 108,12 Q130,14 126,40 Q126,32 108,30 Q90,32 90,40 Z" fill="#6b6558"/>
    <path d="M92,34 Q108,26 124,34 L123,26 Q108,20 93,26 Z" fill="#3a3e42"/>
    <rect x="94" y="34" width="28" height="4" fill="#2b2f33"/>
    <ellipse cx="100" cy="36" rx="6" ry="5" fill="#3a3e42"/>
    <ellipse cx="116" cy="36" rx="6" ry="5" fill="#3a3e42"/>
    <ellipse cx="100" cy="36" rx="4" ry="3" fill="#55595e"/>
    <ellipse cx="116" cy="36" rx="4" ry="3" fill="#55595e"/>
    <circle cx="117" cy="35" r="1.3" fill="#ffb454"/>
  </g>

  <g id="weapon-arm">
    <!-- draw arm / trigger hand -->
    <path d="M98,66 Q92,74 96,82 Q99,88 106,86 L112,82 Q110,74 104,68 Z" fill="#3a3e42"/>
    <circle cx="114" cy="80" r="6" fill="#e0b088"/>

    <!-- rifle stock -->
    <path d="M108,74 L120,72 L124,90 L110,92 Z" fill="#6b6558"/>

    <!-- long thin barrel: full weapon replacement, no more bow -->
    <rect x="120" y="77" width="66" height="6" rx="2" fill="#2b2f33"/>
    <rect x="120" y="77" width="66" height="2" fill="#55595e" opacity="0.6"/>

    <!-- lock/hammer mechanism -->
    <rect x="122" y="70" width="10" height="8" rx="2" fill="#3a3e42"/>
    <path d="M124,70 L120,62 L128,68 Z" fill="#2b2f33"/>

    <!-- simple sight with amber indicator -->
    <rect x="150" y="73" width="4" height="5" fill="#3a3e42"/>
    <circle cx="152" cy="74" r="1" fill="#ffb454"/>

    <!-- fore-grip arm -->
    <path d="M120,64 Q136,64 142,76 Q144,82 138,84 L133,80 Q128,70 116,70 Z" fill="#6b6558"/>
    <circle cx="141" cy="79" r="6" fill="#e0b088"/>
    <rect x="137" y="76" width="8" height="8" rx="2" fill="#2b2f33"/>
  </g>

  <!-- rank badge (bottom-right, clear of the rifle) -->
  <g id="rank-badge">
    <circle cx="178" cy="176" r="11" fill="#0b0e12"/>
    <text x="178" y="181" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3" text-anchor="middle">4</text>
  </g>
</svg>
